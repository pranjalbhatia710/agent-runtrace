[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtrace"
version = "0.1.0"
description = "Local-first trace recorder and HTML viewer for AI agent runs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Pranjal Bhatia"}]
keywords = ["ai-agents", "llm", "observability", "debugging", "tracing", "devtools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pranjalbhatia710/agent-runtrace"
Repository = "https://github.com/pranjalbhatia710/agent-runtrace"
Issues = "https://github.com/pranjalbhatia710/agent-runtrace/issues"

[project.scripts]
agent-runtrace = "agent_runtrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtrace"]
